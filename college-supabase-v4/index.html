<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ລະບົບບໍລິຫານວິທະຍາໄລ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <a href="#/" class="brand" style="color:inherit;text-decoration:none">
      <div class="logo">🏫</div>
      <div><b data-app-name>ວິທະຍາໄລ</b><span id="currentYear">ສົກຮຽນ —</span></div>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="authBox"></div>
    <div class="sidebar-foot small">ລະບົບບໍລິຫານຂໍ້ມູນນັກສຶກສາ · © <span id="year"></span></div>
  </aside>

  <div class="content">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="menu">☰</button>
      <div class="title" id="pageTitle">ພາບລວມ</div>
      <div class="grow"></div>
      <a href="#/students/new" class="btn btn-primary btn-sm no-print">＋ ເພີ່ມນັກສຶກສາ</a>
    </header>
    <main id="main"></main>
  </div>
</div>
<div class="toast-wrap" id="toasts"></div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  const sb_ = document.getElementById('sidebar');
  document.getElementById('burger').addEventListener('click', () => sb_.classList.toggle('open'));
  window.addEventListener('hashchange', () => sb_.classList.remove('open'));
  sb_.addEventListener('click', (e) => { if (e.target === sb_) sb_.classList.remove('open'); });
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
